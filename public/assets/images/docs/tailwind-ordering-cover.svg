<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="tw-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04141e"/>
      <stop offset="60%" stop-color="#072233"/>
      <stop offset="100%" stop-color="#020a10"/>
    </linearGradient>
    <radialGradient id="tw-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#tw-bg)"/>
  <circle cx="850" cy="300" r="320" fill="url(#tw-glow)"/>

  <!-- Box Model Concentric Diagram on Right -->
  <g transform="translate(620, 100)">
    <rect width="480" height="420" rx="16" fill="#0f172a" stroke="#164e63" stroke-width="2"/>
    <text x="30" y="45" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">OUTSIDE-IN BOX MODEL PRINCIPLE</text>

    <!-- Concentric Boxes -->
    <rect x="30" y="70" width="420" height="310" rx="14" fill="#083344" stroke="#06b6d4" stroke-dasharray="4 4"/>
    <text x="45" y="95" font-family="monospace" font-size="12" fill="#7dd3fc">1. Position &amp; Margin (relative, mx-auto, mt-4)</text>

    <rect x="50" y="110" width="380" height="250" rx="12" fill="#0e7490" fill-opacity="0.3" stroke="#22d3ee"/>
    <text x="65" y="135" font-family="monospace" font-size="12" fill="#a5f3fc">2. Display &amp; Sizing (flex, w-full, gap-4)</text>

    <rect x="70" y="150" width="340" height="190" rx="10" fill="#155e75" fill-opacity="0.5" stroke="#67e8f9"/>
    <text x="85" y="175" font-family="monospace" font-size="12" fill="#cffafe">3. Padding &amp; Border (p-5, rounded-xl)</text>

    <rect x="90" y="190" width="300" height="130" rx="8" fill="#164e63" fill-opacity="0.7" stroke="#a5f3fc"/>
    <text x="105" y="215" font-family="monospace" font-size="12" fill="#ffffff">4. Background &amp; Surface (bg-card, shadow-sm)</text>

    <rect x="110" y="230" width="260" height="70" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="125" y="255" font-family="monospace" font-size="12" fill="#38bdf8">5. Typography &amp; Text (font-bold, text-sm)</text>
    <text x="125" y="280" font-family="monospace" font-size="11" fill="#94a3b8">6. Modifiers: hover:bg-muted active:scale-95</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#06b6d4"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">TAILWIND CSS</text>
    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">The Box-Model Principle:</text>
    <text x="0" y="135" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#38bdf8" letter-spacing="-1">Class Ordering</text>
    <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Stop writing chaotic utility strings. Learn the Outside-In mental model.</text>
  </g>
</svg>
