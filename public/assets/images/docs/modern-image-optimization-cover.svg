<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="250" cy="200" r="280" fill="url(#orb-cyan)"/>
  <circle cx="950" cy="400" r="300" fill="url(#orb-green)"/>

  <!-- Main Hero Graphic Container -->
  <g transform="translate(100, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#06b6d4"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CORE WEB VITALS</text>

    <!-- Title -->
    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Modern Image Optimization
    </text>
    <text x="0" y="130" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      AVIF, WebP, CLS Prevention &amp; Next-Gen Mobile Caching
    </text>

    <!-- Visual Benchmarks Card 1: AVIF -->
    <g transform="translate(0, 180)">
      <rect width="300" height="180" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#06b6d4" fill-opacity="0.15"/>
      <path d="M 36 34 L 52 50 M 52 34 L 36 50" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
      <text x="80" y="44" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">.AVIF Format</text>
      <text x="80" y="64" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">Hero &amp; Marketing Photos</text>
      <text x="24" y="120" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#34d399">-55%</text>
      <text x="120" y="118" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">File size vs JPEG<tspan x="120" y="136" font-size="12" fill="#64748b">Lossless visual quality</tspan></text>
      <rect x="20" y="152" width="260" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="152" width="220" height="6" rx="3" fill="#06b6d4"/>
    </g>

    <!-- Visual Benchmarks Card 2: WebP -->
    <g transform="translate(340, 180)">
      <rect width="300" height="180" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#10b981" fill-opacity="0.15"/>
      <circle cx="44" cy="44" r="12" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="80" y="44" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">.WebP Format</text>
      <text x="80" y="64" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">UI Avatars &amp; Thumbnails</text>
      <text x="24" y="120" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#38bdf8">-35%</text>
      <text x="120" y="118" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">With Alpha Channel<tspan x="120" y="136" font-size="12" fill="#64748b">100% browser support</tspan></text>
      <rect x="20" y="152" width="260" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="152" width="180" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Visual Benchmarks Card 3: CLS Score -->
    <g transform="translate(680, 180)">
      <rect width="320" height="180" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#38bdf8" fill-opacity="0.15"/>
      <path d="M 34 50 L 44 34 L 54 50 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
      <text x="80" y="44" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Zero CLS Shift</text>
      <text x="80" y="64" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">Aspect-Ratio Reservation</text>
      <text x="24" y="120" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#4ade80">0.00</text>
      <text x="120" y="118" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Cumulative Layout Shift<tspan x="120" y="136" font-size="12" fill="#4ade80">Perfect 100/100 score</tspan></text>
      <rect x="20" y="152" width="280" height="6" rx="3" fill="#334155"/>
      <rect x="20" y="152" width="280" height="6" rx="3" fill="#4ade80"/>
    </g>
  </g>
</svg>
