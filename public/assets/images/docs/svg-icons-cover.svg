<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="svg-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041527"/>
      <stop offset="60%" stop-color="#092543"/>
      <stop offset="100%" stop-color="#030b14"/>
    </linearGradient>
    <radialGradient id="svg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#svg-bg)"/>
  <circle cx="850" cy="300" r="320" fill="url(#svg-glow)"/>

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">VECTOR ASSETS</text>

    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      SVG &amp; Icon Architecture
    </text>
    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#38bdf8" letter-spacing="-1">
      in React &amp; Mobile
    </text>
    <text x="0" y="195" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Zero-runtime icon sprites, currentColor semantics, and bundle hygiene.
    </text>
  </g>

  <!-- Right Visual Mockup -->
  <g transform="translate(620, 110)">
    <rect width="480" height="400" rx="20" fill="#0c1e36" stroke="#1e40af" stroke-width="2"/>
    <text x="30" y="45" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1">ICON SPRITE &amp; RUNTIME PIPELINE</text>

    <!-- Icon Grid Preview -->
    <g transform="translate(30, 70)">
      <rect width="125" height="110" rx="12" fill="#172e54" stroke="#2563eb"/>
      <circle cx="62" cy="45" r="18" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
      <path d="M 62 37 L 62 47 L 70 47" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
      <text x="62" y="85" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">&lt;Clock /&gt;</text>

      <rect x="145" width="125" height="110" rx="12" fill="#172e54" stroke="#2563eb"/>
      <path d="M 207 33 L 221 57 L 193 57 Z" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="207" y="85" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">&lt;Alert /&gt;</text>

      <rect x="290" width="130" height="110" rx="12" fill="#172e54" stroke="#2563eb"/>
      <path d="M 355 33 L 355 57 M 343 45 L 355 33 L 367 45" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="355" y="85" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">&lt;Upload /&gt;</text>
    </g>

    <!-- Symbol Sprite Container -->
    <g transform="translate(30, 205)">
      <rect width="420" height="165" rx="12" fill="#081528" stroke="#1d4ed8" stroke-dasharray="4 4"/>
      <text x="20" y="32" font-family="monospace" font-size="12" fill="#38bdf8">&lt;svg class="icon" aria-hidden="true"&gt;</text>
      <text x="40" y="62" font-family="monospace" font-size="12" fill="#e2e8f0">&lt;use href="/sprites.svg#icon-clock" /&gt;</text>
      <text x="20" y="92" font-family="monospace" font-size="12" fill="#38bdf8">&lt;/svg&gt;</text>
      <text x="20" y="130" font-family="monospace" font-size="11" fill="#64748b">Zero extra JS payload • Instant HTTP/2 cache hit</text>
    </g>
  </g>
</svg>
