<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="dm-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>
    <radialGradient id="dm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dm-bg)"/>
  <circle cx="850" cy="300" r="320" fill="url(#dm-glow)"/>

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#34d399"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1.5">DARK MODE</text>

    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Bulletproof Dark Mode
    </text>
    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#34d399" letter-spacing="-1">
      &amp; Theme Architecture
    </text>
    <text x="0" y="195" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Flicker-free zero-FOUC hydration, OKLCH tokens, and Tailwind v4 themes.
    </text>
  </g>

  <!-- Right Split Theme Card -->
  <g transform="translate(620, 110)">
    <rect width="480" height="400" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- Split Mockup: Left Dark, Right Light -->
    <g transform="translate(30, 40)">
      <!-- Dark Half -->
      <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 210 0 L 210 240 L 0 240 Z" fill="#030712" stroke="#1f2937"/>
      <circle cx="45" cy="40" r="10" fill="#10b981"/>
      <rect x="70" y="32" width="100" height="16" rx="4" fill="#1f2937"/>
      <rect x="35" y="70" width="140" height="12" rx="3" fill="#374151"/>
      <rect x="35" y="95" width="110" height="12" rx="3" fill="#1f2937"/>
      <rect x="35" y="130" width="90" height="28" rx="6" fill="#10b981"/>

      <!-- Light Half -->
      <path d="M 210 0 L 404 0 C 412.837 0 420 7.163 420 16 L 420 240 L 210 240 Z" fill="#f8fafc"/>
      <circle cx="255" cy="40" r="10" fill="#059669"/>
      <rect x="280" y="32" width="100" height="16" rx="4" fill="#e2e8f0"/>
      <rect x="245" y="70" width="140" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="245" y="95" width="110" height="12" rx="3" fill="#e2e8f0"/>
      <rect x="245" y="130" width="90" height="28" rx="6" fill="#059669"/>

      <!-- Center Toggle Pill -->
      <rect x="180" y="105" width="60" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <circle cx="196" cy="120" r="10" fill="#38bdf8"/>
    </g>

    <!-- Token Blueprint at Bottom -->
    <g transform="translate(30, 305)">
      <rect width="420" height="65" rx="10" fill="#020617" stroke="#0f766e"/>
      <text x="20" y="27" font-family="monospace" font-size="11" fill="#34d399">--color-surface: oklch(0.2 0.02 260);</text>
      <text x="20" y="47" font-family="monospace" font-size="11" fill="#94a3b8">Zero flash of unstyled theme • localStorage + system match</text>
    </g>
  </g>
</svg>
