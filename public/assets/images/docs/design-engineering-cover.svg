<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="curve-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="url(#grid2)"/>

  <!-- Orbs -->
  <circle cx="900" cy="200" r="300" fill="url(#orb-purple)"/>
  <circle cx="300" cy="450" r="260" fill="url(#orb-pink)"/>

  <!-- Motion Curves Visualization -->
  <g transform="translate(620, 120)">
    <rect width="480" height="380" rx="20" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
    <path d="M 40 320 C 140 320 180 60 440 60" stroke="url(#curve-grad)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="320" r="8" fill="#8b5cf6"/>
    <circle cx="440" cy="60" r="8" fill="#06b6d4"/>
    <line x1="40" y1="320" x2="440" y2="320" stroke="#475569" stroke-dasharray="4 4"/>
    <line x1="40" y1="60" x2="440" y2="60" stroke="#475569" stroke-dasharray="4 4"/>
    <text x="50" y="300" font-family="monospace" font-size="12" fill="#94a3b8">cubic-bezier(0.16, 1, 0.3, 1)</text>
    <text x="320" y="90" font-family="monospace" font-size="12" fill="#38bdf8">spring(1, 100, 10)</text>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#a855f7"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1.5">INTERACTION DESIGN</text>

    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Design Engineering:
    </text>
    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#c084fc" letter-spacing="-1">
      Motion &amp; Micro-Interactions
    </text>
    <text x="0" y="195" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Custom easing curves, spring physics, and fluid UI details.
    </text>
  </g>
</svg>
