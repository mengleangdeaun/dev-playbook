<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="astro-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="60%" stop-color="#120c1f"/>
      <stop offset="100%" stop-color="#220b33"/>
    </linearGradient>
    <linearGradient id="astro-flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5d01"/>
      <stop offset="100%" stop-color="#d83333"/>
    </linearGradient>
    <radialGradient id="astro-glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5d01" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5d01" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="astro-glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#883aea" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#883aea" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#astro-bg)"/>

  <!-- Glowing Glow behind Rocket -->
  <circle cx="850" cy="300" r="280" fill="url(#astro-glow1)"/>
  <circle cx="950" cy="320" r="240" fill="url(#astro-glow2)"/>

  <!-- Rocket / Island Graphic on Right -->
  <g transform="translate(750, 150)">
    <!-- Speed dials -->
    <rect width="360" height="320" rx="24" fill="#181324" stroke="#382952" stroke-width="2"/>
    <text x="30" y="50" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#a855f7" letter-spacing="1">MIGRATION BENCHMARKS</text>

    <!-- Speed 1 -->
    <text x="30" y="115" font-family="Inter, sans-serif" font-size="44" font-weight="800" fill="#22c55e">0.2s</text>
    <text x="30" y="145" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Cold Start First Contentful Paint</text>

    <!-- Speed 2 -->
    <text x="30" y="210" font-family="Inter, sans-serif" font-size="44" font-weight="800" fill="#ff5d01">-70%</text>
    <text x="30" y="240" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">JavaScript shipped to clients</text>

    <!-- Progress bar -->
    <rect x="30" y="275" width="300" height="8" rx="4" fill="#382952"/>
    <rect x="30" y="275" width="280" height="8" rx="4" fill="url(#astro-flame)"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#ff5d01" fill-opacity="0.15" stroke="#ff5d01" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#ff5d01"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff782d" letter-spacing="1.5">CASE STUDY</text>

    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Why We Migrated to Astro
    </text>
    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      How switching from client-side SPAs to Astro's content layer
    </text>
    <text x="0" y="170" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      cut our build times and unlocked instant documentation navigation.
    </text>
  </g>
</svg>
