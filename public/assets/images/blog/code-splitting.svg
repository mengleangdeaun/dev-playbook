<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1716"/>
      <stop offset="60%" stop-color="#062421"/>
      <stop offset="100%" stop-color="#020d0c"/>
    </linearGradient>
    <radialGradient id="cs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#cs-bg)"/>
  <circle cx="850" cy="300" r="320" fill="url(#cs-glow)"/>

  <!-- Code Splitting Chunks Diagram Right -->
  <g transform="translate(620, 120)">
    <rect width="480" height="380" rx="20" fill="#061c1a" stroke="#047857" stroke-width="2"/>
    <text x="30" y="45" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1">BUNDLE DECOMPOSITION</text>

    <!-- Chunk 1: Main (slim) -->
    <rect x="30" y="70" width="420" height="65" rx="12" fill="#064e3b" stroke="#10b981"/>
    <text x="50" y="100" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ecfdf5">main.js (Initial Critical Chunk)</text>
    <text x="50" y="120" font-family="monospace" font-size="12" fill="#6ee7b7">42 KB gzipped • Parsed in 45ms</text>

    <!-- Arrow down -->
    <path d="M 240 145 L 240 170" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Chunk 2: Async Route -->
    <rect x="30" y="180" width="200" height="80" rx="10" fill="#022c22" stroke="#059669"/>
    <text x="45" y="210" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">analytics.chunk.js</text>
    <text x="45" y="235" font-family="monospace" font-size="11" fill="#6ee7b7">Lazy on idle</text>

    <!-- Chunk 3: Modal Route -->
    <rect x="250" y="180" width="200" height="80" rx="10" fill="#022c22" stroke="#059669"/>
    <text x="265" y="210" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">editor.chunk.js</text>
    <text x="265" y="235" font-family="monospace" font-size="11" fill="#6ee7b7">Lazy on click</text>

    <rect x="30" y="285" width="420" height="65" rx="10" fill="#047857" fill-opacity="0.3"/>
    <text x="50" y="322" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#34d399">✓ 0 KB unused JavaScript in initial viewport</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#10b981"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1.5">PERFORMANCE</text>
    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">Code-Splitting</text>
    <text x="0" y="135" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#34d399" letter-spacing="-1">&amp; Bundle Hygiene</text>
    <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Route-level chunking, dynamic imports, and lean dependencies.</text>
  </g>
</svg>
