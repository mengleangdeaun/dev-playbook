<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="pvs-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141108"/>
      <stop offset="60%" stop-color="#241b07"/>
      <stop offset="100%" stop-color="#0a0802"/>
    </linearGradient>
    <radialGradient id="pvs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pvs-bg)"/>
  <circle cx="850" cy="300" r="320" fill="url(#pvs-glow)"/>

  <!-- Versus Diagram Right -->
  <g transform="translate(620, 120)">
    <rect width="480" height="380" rx="20" fill="#1c1608" stroke="#452f08" stroke-width="2"/>
    <text x="30" y="45" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1">DIRECTORY STRATEGY</text>

    <!-- Public / -->
    <rect x="30" y="70" width="420" height="120" rx="12" fill="#2d2207" stroke="#f59e0b"/>
    <text x="50" y="100" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fef3c7">📁 public/ (Unprocessed Root)</text>
    <text x="50" y="125" font-family="Inter, sans-serif" font-size="12" fill="#fde68a">• robots.txt, sitemap.xml, favicon.ico</text>
    <text x="50" y="145" font-family="Inter, sans-serif" font-size="12" fill="#fde68a">• Static download files and OpenGraph crawl cards</text>
    <text x="50" y="165" font-family="monospace" font-size="11" fill="#f59e0b">Served raw without Vite hashing</text>

    <!-- Src/assets / -->
    <rect x="30" y="210" width="420" height="120" rx="12" fill="#2d2207" stroke="#fbbf24"/>
    <text x="50" y="240" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fef3c7">📁 src/assets/ (Bundled &amp; Optimized)</text>
    <text x="50" y="265" font-family="Inter, sans-serif" font-size="12" fill="#fde68a">• UI images processed via Astro / Vite Image</text>
    <text x="50" y="285" font-family="Inter, sans-serif" font-size="12" fill="#fde68a">• Automatic content hashing &amp; immutable HTTP caching</text>
    <text x="50" y="305" font-family="monospace" font-size="11" fill="#fbbf24">WebP conversion + CLS width/height</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#f59e0b"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1.5">ASSET STORAGE</text>
    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">public/ vs. src/assets/</text>
    <text x="0" y="135" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#fbbf24" letter-spacing="-1">Decision Guide</text>
    <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">When to bundle with Vite/Astro vs. when to serve static public files.</text>
  </g>
</svg>
