<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="mobile-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1215"/>
      <stop offset="60%" stop-color="#062226"/>
      <stop offset="100%" stop-color="#031012"/>
    </linearGradient>
    <radialGradient id="mobile-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#mobile-bg)"/>
  <circle cx="850" cy="300" r="320" fill="url(#mobile-glow)"/>

  <!-- Phone Frame on Right -->
  <g transform="translate(760, 80)">
    <rect width="280" height="480" rx="36" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <!-- Dynamic Island / Notch -->
    <rect x="95" y="16" width="90" height="20" rx="10" fill="#020617"/>
    <!-- Screen content -->
    <rect x="16" y="50" width="248" height="410" rx="20" fill="#020617"/>

    <!-- App Card inside screen -->
    <rect x="32" y="75" width="216" height="110" rx="14" fill="#0d9488" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="48" y="105" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#5eead4">Portfolio Balance</text>
    <text x="48" y="140" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff">$84,250.00</text>
    <text x="48" y="165" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#34d399">+14.2% this quarter</text>

    <!-- Quick action buttons -->
    <g transform="translate(32, 205)">
      <rect width="48" height="48" rx="12" fill="#1e293b"/>
      <path d="M 24 16 L 24 32 M 16 24 L 32 24" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="56" width="48" height="48" rx="12" fill="#1e293b"/>
      <circle cx="80" cy="24" r="8" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <rect x="112" width="48" height="48" rx="12" fill="#1e293b"/>
      <rect x="168" width="48" height="48" rx="12" fill="#1e293b"/>
    </g>

    <!-- Transactions List -->
    <rect x="32" y="275" width="216" height="50" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="48" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Apple Pay Transit</text>
    <text x="210" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="end">-$4.50</text>

    <rect x="32" y="335" width="216" height="50" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="48" y="365" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Payroll Deposit</text>
    <text x="210" y="365" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="end">+$6,400</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="5" fill="#14b8a6"/>
    <text x="34" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf" letter-spacing="1.5">REACT NATIVE</text>

    <text x="0" y="85" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      Cross-Platform Mobile App
    </text>
    <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Offline-first financial companion with SQLite local sync,
    </text>
    <text x="0" y="170" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      biometric authentication, and native spring interactions.
    </text>
  </g>
</svg>
